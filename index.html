.donation-panel{border:1px solid var(--line);border-top:2px solid var(--green);background:#1b2119;padding:30px;min-width:0}.donation-panel-top{display:flex;justify-content:space-between;align-items:center;font:10px var(--mono);letter-spacing:1px;color:var(--green);margin-bottom:35px}.donation-panel-top>span:last-child{font-size:28px;line-height:1}.donation-panel h2{font-size:30px;margin-bottom:12px}.donation-panel>p{font-size:13px;line-height:1.8}.donation-copy,.donation-paypal{display:flex;justify-content:space-between;width:100%;margin:12px 0;min-height:52px}.donation-panel .donation-note{font-size:11px;line-height:1.8;margin-bottom:0}.donation-recipient{border-top:1px solid var(--line);margin:26px 0 16px;padding-top:22px;display:flex;flex-direction:column;align-items:flex-start;gap:12px}.donation-recipient>span{font:9px var(--mono);letter-spacing:1px;color:var(--muted)}.donation-recipient code{font:13px/1.8 var(--mono);overflow-wrap:anywhere;max-width:100%;user-select:all}.donation-recipient button{min-height:44px;border-bottom:1px solid var(--line);font-size:12px}.donation-signoff{display:flex;justify-content:space-between;gap:20px;border-top:1px solid var(--line);padding-top:20px;font:10px/1.7 var(--mono);letter-spacing:.8px;color:var(--muted)}.donation-signoff>span:last-child{color:var(--green)}
@media(min-width:601px) and (max-width:820px){.primary-nav{gap:12px}.masthead{gap:14px}.mast-actions{padding-left:12px}}
@media(max-width:820px){.donation-layout{gap:30px;padding-block:45px}.donation-intro h1{font-size:64px}.donation-intro>p{font-size:14px}.donation-panel{padding:23px}.donation-panel h2{font-size:25px}.donation-recipient code{font-size:11px}.footer{flex-wrap:wrap;padding-block:20px}}
@media(max-width:600px){.donation-layout{grid-template-columns:minmax(0,1fr);padding:35px 0;gap:32px}.donation-intro h1{font-size:clamp(62px,17vw,92px)}.donation-intro .eyebrow{font-size:8px;margin-bottom:20px}.donation-intro>p{max-width:none}.donation-intro .donation-free{margin:18px 0}.donation-panel{padding:24px}.donation-panel-top{margin-bottom:26px}.donation-recipient code{font-size:12px}.donation-signoff{font-size:8px}.primary-nav a{padding-inline:7px}.donation-page .cover-line{font-size:7px;gap:10px}}

.donation-panel .donation-online{margin-top:12px}.donation-copy{margin-top:24px}

<script>const SOURCES = {

  stats:{title:'GOKZ — définition des jumpstats',url:'https://github.com/KZGlobalTeam/gokz/wiki/Jumpstats',type:'Documentation officielle',desc:'Types de sauts, unités et conditions de validité. Attention : la ligne Airtime est ancienne ; voir le changelog.'},

  tiers:{title:'GOKZ — seuils de distance',url:'https://github.com/KZGlobalTeam/gokz/blob/master/cfg/sourcemod/gokz/gokz-jumpstats-tiers.cfg',type:'Code source',desc:'Seuils configurables du plugin ; pas un barème CS2.'},

  cpgo:{title:'GOKZ — commandes de checkpoint',url:'https://github.com/KZGlobalTeam/gokz/blob/master/addons/sourcemod/scripting/gokz-core/commands.sp',type:'Code source',desc:'Enregistrement de sm_checkpoint, sm_gocheck et des autres commandes du noyau.'},

  cpcs2:{title:'CS2KZ — commandes de checkpoint',url:'https://github.com/KZGlobalTeam/cs2kz-metamod/blob/master/src/kz/checkpoint/commands.cpp',type:'Code source',desc:'Définitions de kz_checkpoint / kz_cp et kz_teleport / kz_tp.'},
  vnlcs2:{title:'CS2KZ — réglages Vanilla',url:'https://github.com/KZGlobalTeam/cs2kz-metamod/blob/master/src/kz/mode/kz_mode_vnl.h',type:'Code source',desc:'Réglages de mouvement et système de saut appliqués par VNL.'},
  ckzcs2:{title:'CS2KZ — réglages Classic',url:'https://github.com/KZGlobalTeam/cs2kz-metamod/blob/master/src/kz/mode/kz_mode_ckz.h',type:'Code source',desc:'Réglages de mouvement et système de saut appliqués par CKZ.'},

  valvebind:{title:'Valve — binds et automatisation',url:'https://store.steampowered.com/news/posts/?appids=730&enddate=1724194853&feed=steam_community_announcements',type:'Notes de mise à jour',desc:'Mise à jour du 19 août 2024 : restrictions des commandes combinées et automatisations.'},
  valvejump:{title:'Valve — évolution des sauts CS2',url:'https://store.steampowered.com/news/posts/?appids=730&enddate=1769036296&feed=steam_community_announcements',type:'Notes de mise à jour',desc:'21 janvier 2026 : atterrissage subtick, fenêtre de bhop et pénalité de spam.'},

};
const VIDEOS = [
 {title:'Air strafing',id:'2n1n3BuiDuM',kind:'strafe',desc:'Observer l’association des touches et de la souris.'},
 {title:'Ladder jumps',id:'Yj-55CXGmmM',kind:'ladder',desc:'Observer l’approche et la sortie de l’échelle.'},
 {title:'Bunnyhopping',id:'YzdGikS7DYA',kind:'bhop',desc:'Observer le rythme des sauts et les réceptions.'}
];
const LESSONS = [
 {id:'start',title:'Tes premiers blocs',short:'Bien commencer',group:'LES FONDATIONS',number:'01',level:'Débutant',minutes:5,desc:'Choisir son terrain, comprendre CP / TP et réussir sa première map.',
 intro:'Le KZ, c’est traverser une map grâce à ton mouvement. Avant le chrono, apprends à lire les blocs et à reproduire un saut.',
 sources:['gokz','browser','installgo','lan'],
 sections:[
  {title:'Choisir le bon terrain',html:`<p>Rejoins un serveur KZ qui indique son plugin et son mode. Pour débuter, cherche une carte facile : tier 1 ou 2. Une zone de longjump plate est utile, mais finir une petite map t’apprend aussi à viser les réceptions.</p><p>Sur CS2, le <a href="https://cs2kz.org/" target="_blank" rel="noopener noreferrer">portail CS2KZ</a> sert de point de départ pour trouver un serveur. Sur CS:GO, vérifie que le serveur utilise bien GOKZ avant de copier les commandes de ce guide.</p><div class="callout"><div class="callout-label">TON PREMIER OBJECTIF</div><p>Finir une map facile avec autant de téléportations que nécessaire. Le nombre de TP sert à apprendre, pas à juger ton niveau.</p></div>`},
  {title:'Checkpoint, essai, retour',html:`[[diagram:route]]<div class="steps"><div class="step"><div><h3>Observe la réception</h3><p>Repère une surface large et stable, puis choisis ton point de départ.</p></div></div><div class="step"><div><h3>Pose un checkpoint</h3><p>Un CP mémorise une position autorisée par le serveur. Il te permet de travailler le même passage.</p></div></div><div class="step"><div><h3>Change une seule chose</h3><p>Essaie une nouvelle direction, un décollage un peu plus tardif ou un mouvement de souris plus doux. Reviens au CP après l’essai.</p></div></div></div>`},
  {title:'Préparer les commandes',html:`<p>Active la console développeur dans les paramètres du jeu et attribue-lui une touche accessible. Dans le <a href="#binds">générateur de binds</a>, choisis ton jeu et le plugin du serveur. Garde le saut et le crouch sur deux entrées distinctes pour apprendre leur timing.</p><p>Pour un serveur de jeu sur ton PC, il faut installer les composants KZ : ouvrir une carte Workshop ne suffit pas à reproduire la physique d’un serveur. Le guide CS2KZ LAN cité ici concerne Windows ; le présent site de documentation fonctionne aussi sous Linux.</p>`}
 ],exercise:{title:'Une première map, sans pression',text:'Choisis trois passages faciles. Pose un CP avant chacun et réussis-les trois fois. Puis relie-les. Note simplement quel passage te faisait perdre le contrôle.'}},
 {id:'modes',title:'Même jeu. Autre physique.',short:'Comprendre les modes',group:'LES FONDATIONS',number:'02',level:'Indispensable',minutes:5,desc:'VNL, SKZ, KZT, CKZ : comparer uniquement ce qui est comparable.',
 intro:'Le nom du jeu ne suffit pas. Le plugin, le mode et ses réglages déterminent les sauts que tu peux réaliser.',
 sources:['modesgo','modescs2','vnlcs2','ckzcs2'],
 sections:[
 {title:'La carte des modes',html:`<div class="table-wrap"><table><thead><tr><th>Jeu / plugin</th><th>Mode</th><th>Ce qu’il faut retenir</th></tr></thead><tbody><tr><td>CS:GO / GOKZ</td><td>Vanilla · VNL</td><td>Mouvement proche du CS:GO natif ; pas de bonus de prestrafe ajouté.</td></tr><tr><td>CS:GO / GOKZ</td><td>SimpleKZ · SKZ</td><td>Prestrafe et mouvement modifiés ; accélération aérienne plus élevée.</td></tr><tr><td>CS:GO / GOKZ</td><td>KZTimer · KZT</td><td>Autre mode modifié ; comportement des bhops différent de SKZ.</td></tr><tr><td>CS2 / CS2KZ</td><td>Vanilla · VNL</td><td>Vise à conserver la physique native de CS2.</td></tr><tr><td>CS2 / CS2KZ</td><td>Classic · CKZ</td><td>Successeur spirituel de SKZ, avec ses propres mécanismes.</td></tr></tbody></table></div><div class="callout amber"><div class="callout-label">ATTENTION AU NOM</div><p>Le mode KZT de GOKZ et le plugin autonome KZTimer ne sont pas strictement le même environnement. Les commandes de ce manuel ciblent GOKZ et CS2KZ.</p></div>`},
 {title:'Pourquoi tes distances changent',html:`<p>En GOKZ, l’airacceleration vaut 12 en VNL, contre 100 en SKZ et KZT. Un virage qui fonctionne dans un mode peut donc se comporter autrement dans un autre. Sur CS2KZ, VNL et Classic n’utilisent pas non plus le même système de saut.</p><p>Choisis un environnement pour ta séance et garde-le. Pour comparer deux essais, conserve aussi le type de saut, la hauteur d’arrivée et la version du serveur.</p>`},
 {title:'Quel mode choisir ?',html:`<p>Commence par celui de la communauté où tu as envie de jouer. VNL est pertinent pour travailler un mouvement proche du jeu de base ; les modes modifiés offrent une autre façon de courir les maps. Aucun n’est une étape obligatoire avant l’autre.</p><p>Écris toujours le contexte de ton record : « CS:GO · GOKZ · VNL · LJ », par exemple. Un simple « 250 » ne suffit pas à comprendre la performance.</p>`}
 ],exercise:{title:'Nommer ton environnement',text:'Avant ton prochain essai, identifie le jeu, le plugin et le mode dans le menu du serveur. Inscris ces trois informations dans ton carnet. Ne cherche pas encore un seuil de distance.'}},
 {id:'prestrafe',title:'Tout commence au sol.',short:'Prestrafe & décollage',group:'LES FONDATIONS',number:'03',level:'Fondamental',minutes:6,desc:'Préparer sa vitesse et quitter le bloc au bon endroit.',
 intro:'Un bon saut ne rattrape pas toujours un mauvais départ. Sépare la vitesse de départ, la direction de sortie et la distance au bord.',
 sources:['modesgo','skz','strafing'],
 sections:[
 {title:'Construire un départ régulier',html:`<p>Travaille sur un bloc large, avec un repère visuel fixe. Pars du même endroit et répète la même approche. Observe la vitesse au décollage plutôt que le meilleur pic de vitesse pendant la course.</p>[[diagram:prestrafe]]<p>Pour un saut avant classique, termine ta course avec une trajectoire qui vise la réception. Relâche l’avance au décollage, puis enchaîne ton premier strafe aérien. Les techniques qui conservent W existent, mais elles sortent de ce premier exercice.</p>`},
 {title:'VNL et prestrafe modifié',html:`<p>En GOKZ VNL, n’essaie pas d’obtenir le bonus de prestrafe des modes modifiés. En SKZ, le système récompense une course accompagnée d’un virage ; le maximum documenté est d’environ 276,54 u/s. Inverser le virage réinitialise ce bonus.</p><p>Tourner toujours plus vite n’apporte pas toujours plus de bonus. Cette valeur SKZ n’est ni une cible VNL, ni une promesse pour CS2 Classic.</p><div class="callout"><div class="callout-label">LE REPÈRE UTILE</div><p>Un départ reproductible vaut mieux qu’un départ exceptionnel que tu ne sais pas refaire. Tu pourras ensuite tester ta sortie plus près du bord.</p></div>`},
 {title:'Corriger le décollage',html:`<div class="table-wrap"><table><thead><tr><th>Ce que tu vois</th><th>Essai suivant</th></tr></thead><tbody><tr><td>Vitesse de départ très variable</td><td>Allonge la zone de préparation et garde le même repère de départ.</td></tr><tr><td>Tu tombes sans sauter</td><td>Déclenche le saut un peu avant, puis rapproche-toi progressivement du bord.</td></tr><tr><td>Le premier strafe part de travers</td><td>Réduis le virage final au sol et vise une réception plus large.</td></tr></tbody></table></div>`}
 ],exercise:{title:'10 départs, une seule variable',text:'Sur le même serveur et le même bloc, fais dix départs. Note ton pre et si le saut est bien parti. Ajuste uniquement le point de décollage pendant la série ; garde le reste identique.'}},
 {id:'strafe',title:'Guider la vitesse.',short:'Air strafing',group:'LE MOUVEMENT',number:'04',level:'Fondamental',minutes:7,desc:'Associer une direction clavier à un virage de souris.',
 intro:'Le strafe n’est pas un balayage rapide de la souris. C’est une coordination qui oriente ta trajectoire pendant le vol.',
 sources:['strafing','modesgo','modescs2'],
 sections:[
 {title:'Le mouvement à comprendre',html:`<p>Pour un strafe avant classique : tiens gauche et tourne doucement la vue vers la gauche ; tiens droite et tourne doucement vers la droite. Au changement de côté, change la touche et le sens de rotation ensemble. Relâche l’avance pendant cet exercice.</p>[[diagram:strafe]]<p>Le bon angle dépend de la vitesse et du mode. Un balayage brutal ou trop ample peut dégrader le mouvement. Commence avec un seul virage propre, puis ajoute le retour.</p>`},
 {title:'Apprendre sans se crisper',html:`<div class="steps"><div class="step"><div><h3>Un arc vers la gauche</h3><p>Saute vers une surface très large. Relâche l’avance, tiens gauche et accompagne avec un petit mouvement de souris à gauche.</p></div></div><div class="step"><div><h3>Un arc vers la droite</h3><p>Refais l’exercice en miroir. Cherche le contrôle de l’arrivée, pas la distance maximale.</p></div></div><div class="step"><div><h3>Deux arcs dans le même saut</h3><p>À mi-parcours environ, relâche un côté et prends l’autre en inversant le virage. Ce repère est pédagogique, pas un timing optimal imposé.</p></div></div></div>`},
 {title:'Les pièges habituels',html:`<p>Multiplier les changements n’améliore pas automatiquement ton saut. Si tes derniers strafes ressemblent à de petites secousses, ralentis l’exercice. Observe surtout si tu arrives là où tu voulais.</p><p>Ne modifie pas sensibilité, DPI et amplitude de mouvement en même temps. Garde des réglages confortables ; mesure l’effet d’un seul changement sur plusieurs essais. Aucun chiffre de sensibilité n’est une solution universelle.</p>`}
 ],exercise:{title:'Deux arcs, une cible',text:'Pose un CP devant une large plateforme. Fais cinq sauts avec un seul arc, puis cinq avec deux arcs. Compare la précision de l’arrivée avant de comparer la distance.'}},
 {id:'longjump',title:'Le longjump, décomposé.',short:'Longjump',group:'LE MOUVEMENT',number:'05',level:'Fondamental → avancé',minutes:8,desc:'Assembler l’approche, le décollage, les strafes et la réception.',
 intro:'Un LJ propre est une séquence continue : préparer le départ, quitter le bord, guider le vol et atteindre la réception.',
 sources:['strafing','stats','tiers','modescs2'],
 sections:[
 {title:'Voir la séquence',html:`<p>Cette démonstration montre un saut avant classique. Les touches sont indiquées en QWERTY : en AZERTY, gauche correspond généralement à Q et avance à Z.</p>[[sequence:longjump]]<div class="callout"><div class="callout-label">SCHÉMA, PAS SIMULATEUR</div><p>Les positions, durées et touches du dessin expliquent l’ordre des gestes. Elles ne calculent aucune distance et ne reproduisent pas le moteur du jeu.</p></div>`},
 {title:'Viser le bloc',html:`<p>Choisis une réception plus facile que ton maximum. Fais ton approche avec le même repère, saute près du bord et concentre-toi sur deux ou trois strafes contrôlés. Ce nombre est un exercice, pas une règle de performance.</p><p>La distance de jumpstats et la largeur du vide ne mesurent pas la même chose. Partir loin du bord ou traverser en diagonale peut te faire rater un bloc malgré une distance qui paraît suffisante.</p><p>Travaille l’accroupissement séparément. Pour une réception au même niveau, un crouch pendant la fin du vol peut aider au franchissement du bord ; rester accroupi dès la course change ton départ. Reproduis le même protocole avant de comparer tes essais.</p>`},
 {title:'Lire les paliers sans se tromper',html:`<p>Voici quelques seuils par défaut du fichier GOKZ, uniquement pour les longjumps. Le serveur peut les modifier.</p><div class="table-wrap"><table><thead><tr><th>Palier GOKZ</th><th>VNL</th><th>SKZ / KZT</th></tr></thead><tbody><tr><td>Impressive</td><td>235</td><td>265</td></tr><tr><td>Perfect</td><td>240</td><td>270</td></tr><tr><td>Godlike</td><td>245</td><td>275</td></tr><tr><td>Ownage</td><td>248</td><td>280</td></tr><tr><td>Wrecker</td><td>250</td><td>282</td></tr></tbody></table></div><p>Unités de distance du jeu. Ce tableau ne décrit ni CS2KZ, ni tous les serveurs KZTimer autonomes. Utilise ton propre historique pour fixer ton prochain objectif.</p>`},
 {title:'Quand la distance bloque',html:`<p>Garde trois essais réussis et trois ratés. Compare d’abord le départ et l’orientation de la réception, puis les changements de strafe. Un beau pourcentage de sync ne compense pas forcément une mauvaise trajectoire.</p><p>Si tu réussis un saut sur dix, réduis légèrement la difficulté. Cherche une série reproductible, puis retourne au bloc difficile.</p>`}
 ],exercise:{title:'Deux séries comparables',text:'Fais deux séries de dix LJ dans le même mode. Série A : ton approche habituelle. Série B : change seulement le point de décollage. Compare la médiane des distances et le nombre de réussites, pas seulement le record.'}},
 {id:'ladder',title:'Quitter l’échelle. Garder le contrôle.',short:'Ladderjump',group:'LE MOUVEMENT',number:'06',level:'Intermédiaire',minutes:8,desc:'Distinguer ladderjump, ladderhop et sortie contrôlée.',
 intro:'L’échelle n’est pas un bloc vertical. La phase où tu la quittes doit être travaillée séparément du strafe qui suit.',
 sources:['stats','modesgo','modescs2'],
 sections:[
 {title:'Deux sauts différents',html:`[[diagram:ladder]]<p>Un ladderjump quitte l’échelle sans passer par un appui au sol. Un ladderhop implique un contact échelle + sol avant le saut. Sur GOKZ, la validation d’un LAJ demande notamment que le haut de l’échelle et le bloc cible soient à la même hauteur.</p><p>Ne confonds pas réussir à sortir d’une échelle sur une map avec produire une jumpstat LAJ valide. Les critères de mesure sont plus précis.</p>`},
 {title:'Construire une sortie simple',html:`<div class="steps"><div class="step"><div><h3>Choisis une échelle facile</h3><p>Prends une échelle isolée avec une grande réception proche. Pose un CP autorisé avant l’approche.</p></div></div><div class="step"><div><h3>Stabilise la montée</h3><p>Observe comment ton angle de vue et tes touches modifient la montée. Fixe une approche reproductible avant de chercher la distance.</p></div></div><div class="step"><div><h3>Travaille le détachement</h3><p>Pour une sortie classique au sommet, progresse jusqu’à quitter le volume de l’échelle sans te poser sur un rebord. N’ajoute pas systématiquement une pression sur saut : cela peut te repousser de l’échelle.</p></div></div><div class="step"><div><h3>Ajoute un seul strafe</h3><p>Une fois sorti, guide-toi vers la plateforme avec un mouvement doux. Augmente l’écart seulement quand la sortie est régulière.</p></div></div></div>`},
 {title:'Diagnostiquer une mauvaise sortie',html:`<div class="table-wrap"><table><thead><tr><th>Symptôme</th><th>À examiner</th></tr></thead><tbody><tr><td>Tu restes collé à l’échelle</td><td>Ton déplacement te ramène-t-il dans son volume ? Simplifie l’angle de sortie.</td></tr><tr><td>Tu es projeté avant le sommet</td><td>Vérifie si une pression sur saut a déclenché le détachement trop tôt.</td></tr><tr><td>Une autre jumpstat apparaît</td><td>Vérifie les contacts au sol, la hauteur du bloc et les règles du plugin.</td></tr><tr><td>Tu sors mais rates de côté</td><td>Garde la montée identique et modifie seulement le premier strafe.</td></tr></tbody></table></div><p>Les angles des échelles, leurs rebords et la physique des modes varient. Un angle de caméra fixe ou une recette de touches unique ne peut pas convenir à toutes les situations.</p>`}
 ],exercise:{title:'D’abord sortir, ensuite aller loin',text:'Réussis cinq sorties vers la même plateforme proche. Puis ajoute un strafe, sans changer ton approche. Regarde le tutoriel historique dans les ressources pour visualiser le geste ; vérifie le résultat sur ton propre serveur.'}},
 {id:'bhop',title:'Trouver le rythme.',short:'Bunnyhop',group:'LE MOUVEMENT',number:'07',level:'Intermédiaire',minutes:6,desc:'Enchaîner les réceptions sans confondre scroll et automatisation.',
 intro:'Le bunnyhop relie un atterrissage au saut suivant. Tu travailles le timing, la direction de réception et la préparation du prochain bloc.',
 sources:['modesgo','skz','modescs2','valvejump'],
 sections:[
 {title:'Une réception qui prépare la suite',html:`[[diagram:bhop]]<p>Commence sur une surface plate et large. Associe un scroll manuel au saut, et essaie de repartir près du contact au sol. Le timing précis et la vitesse conservée dépendent du mode.</p><p>Vise une réception qui te laisse de la place pour le saut suivant. Une arrivée sur le coin du bloc peut être impressionnante mais très difficile à enchaîner.</p>`},
 {title:'CS:GO et CS2 ne sont pas identiques',html:`<p>Sur GOKZ, VNL conserve les contraintes du mouvement natif CS:GO ; SKZ et KZT changent les règles des bhops. Classic sur CS2 a également sa propre logique de conservation de vitesse.</p><div class="callout amber"><div class="callout-label">CS2 · MISE À JOUR 2026</div><p>Valve a modifié les sauts natifs en janvier 2026 : atterrissage subtick, fenêtre de bhop et pénalité de spam. Le saut et l’atterrissage n’affectent plus la stamina native comme auparavant. « Scroller le plus possible » n’est donc pas une consigne fiable.</p></div><p>Une ancienne vidéo CS:GO peut illustrer le mouvement, sans donner le timing exact à utiliser en CS2 VNL. Travaille le rythme dans ton mode actuel.</p>`},
 {title:'Progresser avec des mini-chaînes',html:`<p>Commence par deux sauts. Quand ils deviennent réguliers, passe à trois, puis à une petite série de blocs. Si le second saut échoue souvent, répète uniquement la première réception.</p><p>Le site propose un bind simple <code>+jump</code>. Il ne faut pas multiplier automatiquement les entrées de molette : cela ne t’apprend pas le timing et peut enfreindre les règles du serveur.</p>`}
 ],exercise:{title:'Deux, puis trois',text:'Réalise cinq enchaînements de deux sauts sur une surface large. Essaie ensuite trois sauts. Note le point de réception de l’enchaînement qui casse, et place ton prochain checkpoint juste avant.'}},
 {id:'crouch',title:'Gagner de la place.',short:'Crouch & réceptions',group:'LE MOUVEMENT',number:'08',level:'Fondamental',minutes:5,desc:'Utiliser l’accroupissement pour franchir, sans casser son approche.',
 intro:'S’accroupir change le volume de collision du joueur. Son intérêt dépend du passage et du moment où tu l’utilises.',
 sources:['strafing','stats','valvebind'],
 sections:[
 {title:'Trois situations à séparer',html:`[[diagram:crouch]]<div class="table-wrap"><table><thead><tr><th>Situation</th><th>Ce que tu travailles</th></tr></thead><tbody><tr><td>Monter sur un obstacle</td><td>Sauter puis utiliser le crouch pour faire passer le volume du joueur.</td></tr><tr><td>Atteindre un bord éloigné</td><td>La fin de trajectoire et le moment de l’accroupissement.</td></tr><tr><td>Passer sous un plafond</td><td>Une hauteur disponible plus faible ; le passage impose le geste.</td></tr></tbody></table></div><p>Ce sont des situations différentes. Accroupis-toi avec une intention précise plutôt que de garder la touche enfoncée sur tous tes sauts.</p>`},
 {title:'Garder les actions séparées',html:`<p>Apprends avec deux commandes distinctes : saut et accroupissement. Le générateur garde C comme choix initial de crouch, avec Ctrl en alternative. Maintiens la touche pendant le temps utile, puis relâche-la.</p><p>Un bind combinant saut et crouch n’a pas le même comportement selon le jeu ou le plugin. CS2 restreint les binds qui combinent plusieurs actions de mouvement ; le site fournit des commandes simples.</p>`},
 {title:'Lire la collision',html:`<p>Si tu heurtes l’avant d’un bloc, observe où se trouvent tes pieds au moment du contact. Si tu touches un plafond, vérifie l’espace au-dessus de la trajectoire. Le bruit et la vue en spectateur peuvent t’aider à distinguer ces deux cas.</p><p>Sur un passage donné, compare trois timings : tôt dans le vol, au milieu, puis près de l’arrivée. Ne compare que les essais faits avec une approche semblable. Il n’existe pas de nombre de millisecondes universel pour crouch.</p>`}
 ],exercise:{title:'Un obstacle, trois timings',text:'Sur une marche facile, fais trois essais par timing de crouch. Note celui qui passe le plus régulièrement. Retourne ensuite sur une réception plate pour séparer franchissement vertical et longjump.'}},
 {id:'routes',title:'Relier les mouvements.',short:'Lire une map & les routes',group:'PROGRESSER',number:'09',level:'Intermédiaire',minutes:5,desc:'Transformer un passage réussi en un trajet reproductible.',
 intro:'Une map se joue plusieurs mouvements à l’avance. La meilleure réception prépare déjà le prochain départ.',
 sources:['gokz','commands','browser'],
 sections:[
 {title:'Découper une section',html:`[[diagram:route]]<p>Repère une zone sûre, un passage difficile et la sortie de la section. Pose un CP avant la difficulté. Une fois le passage réussi plusieurs fois, éloigne ton CP pour travailler l’approche complète.</p><p>Compare deux routes sur des séries courtes. Un raccourci plus rapide sur un essai peut te faire perdre davantage de temps si tu le rates souvent.</p>`},
 {title:'Utiliser un replay',html:`<p>Les replays GOKZ servent à observer les trajets. Cherche où le joueur décolle, où il atterrit, et ce qu’il prépare ensuite. Commence par un passage accessible plutôt que d’essayer de reproduire un record entier.</p><p>Sur GOKZ, la documentation liste <code>!replay</code>. Sur un autre plugin, utilise le menu ou l’aide du serveur. Les possibilités du replay et l’affichage des touches varient.</p>`},
 {title:'Rendre une route solide',html:`<div class="steps"><div class="step"><div><h3>Réussir le mouvement isolé</h3><p>Travaille-le depuis un checkpoint proche avec une arrivée simple.</p></div></div><div class="step"><div><h3>Ajouter l’approche</h3><p>Recule le point de départ. Le geste doit fonctionner après le mouvement précédent.</p></div></div><div class="step"><div><h3>Ajouter la sortie</h3><p>Continue jusqu’au prochain bloc stable. Une réception n’est utile que si tu peux repartir.</p></div></div></div>`}
 ],exercise:{title:'Une section de trois blocs',text:'Choisis une section courte. Réussis le deuxième bloc isolément, puis les blocs 1 → 2, puis 1 → 2 → 3. Garde la route la plus régulière avant de chercher le chrono.'}},
 {id:'stats',title:'Lire le saut, pas seulement le chiffre.',short:'Comprendre les jumpstats',group:'PROGRESSER',number:'10',level:'Intermédiaire',minutes:7,desc:'Pre, sync, DA, overlap et distance : utiliser chaque mesure à bon escient.',
 intro:'Une jumpstat décrit un essai. Pour trouver une cause, compare plusieurs sauts faits dans le même environnement.',
 sources:['stats','changes','tiers'],
 sections:[
 {title:'Les champs utiles',html:`<div class="table-wrap"><table><thead><tr><th>Champ GOKZ</th><th>Signification</th></tr></thead><tbody><tr><td>Pre / Max</td><td>Vitesse au départ / vitesse maximale en vol.</td></tr><tr><td>Strafes</td><td>Comptés d’après les changements de direction de souris.</td></tr><tr><td>Sync</td><td>Proportion de ticks qui gagnent de la vitesse avec les entrées coordonnées.</td></tr><tr><td>DA / OL</td><td>Ticks sans gauche/droite / ticks avec les deux côtés maintenus.</td></tr><tr><td>W</td><td>Relâchement de l’avance relatif au décollage ; positif = tardif.</td></tr><tr><td>Width</td><td>Angle moyen tourné par strafe.</td></tr><tr><td>Offset</td><td>Différence de hauteur arrivée − départ.</td></tr><tr><td>Crouched</td><td>Ticks accroupis.</td></tr></tbody></table></div><div class="callout"><div class="callout-label">AIRTIME : VÉRIFIE L’UNITÉ</div><p>GOKZ moderne affiche l’airtime global en ticks depuis la version 3.0.0. À 128 ticks/s, 100 ticks représentent environ 0,781 s. L’ancienne page du wiki indique encore des secondes. Ne transfère pas cette unité à tous les plugins CS2.</p></div>`},
 {title:'Un exemple à interpréter',html:`<div class="metric-example"><div><span>DISTANCE</span><b>240.0</b></div><div><span>PRE</span><b>249.9</b></div><div><span>SYNC</span><b>78%</b></div><div><span>DA</span><b>12</b></div></div><p>Exemple fictif, CS:GO / GOKZ / VNL, utilisé pour lire les champs. Ce tableau ne suffit pas à diagnostiquer le saut.</p><p>Si tes prochains essais gardent un pre proche mais deviennent plus réguliers après avoir simplifié les changements de strafe, cette simplification mérite d’être conservée. Vérifie-la sur une nouvelle série avant de conclure.</p>`},
 {title:'Éviter les faux diagnostics',html:`<p>Un pourcentage de sync plus élevé n’implique pas automatiquement plus de distance. Un nombre de strafes plus élevé non plus. Vérifie aussi la direction d’arrivée, le bord, le type de saut et l’offset.</p><p>Ne compare pas une chute avec un LJ à hauteur égale. Ne mélange pas les statistiques de GOKZ, de KZTimer autonome et de CS2KZ. Pour un essai particulier, consulte la définition du plugin utilisé.</p>`}
 ],exercise:{title:'Comparer des séries, pas des records',text:'Conserve dix essais du même saut. Note la médiane des distances et le nombre de réussites. Choisis un seul point à travailler pour les dix suivants. Une amélioration répétable est plus informative qu’un chiffre isolé.'}},
 {id:'advanced',title:'La suite du parcours.',short:'Techniques avancées',group:'PROGRESSER',number:'11',level:'Avancé',minutes:5,desc:'WJ, pre-keep, jumpbug, slides : savoir quoi explorer ensuite.',
 intro:'Les techniques avancées répondent à des situations précises. Apprends d’abord à reconnaître le problème avant de chercher le geste.',
 sources:['stats','modescs2','skz'],
 sections:[
 {title:'Reconnaître les familles',html:`<div class="table-wrap"><table><thead><tr><th>Terme</th><th>Idée</th><th>Prérequis</th></tr></thead><tbody><tr><td>Weirdjump · WJ</td><td>Quitter un rebord sans sauter, puis rebondir à la réception.</td><td>Chute contrôlée et bhop. Critères de mesure propres au plugin.</td></tr><tr><td>Pre-keep</td><td>Préserver une vitesse utile d’un mouvement au suivant.</td><td>Comprendre le mode et les règles du bloc.</td></tr><tr><td>Jumpbug · JB</td><td>Transition d’accroupissement et de saut près du contact au sol.</td><td>Timing avancé ; pas de recette identique sur tous les jeux.</td></tr><tr><td>Slide / surf</td><td>Utiliser la géométrie d’une pente pour guider le mouvement.</td><td>Lecture de pente, entrée et sortie contrôlées.</td></tr><tr><td>Half-sideways · HSW</td><td>Un style d’orientation et d’entrées différent du strafe avant classique.</td><td>Comprendre le mouvement avant de chercher le style.</td></tr></tbody></table></div>`},
 {title:'Une méthode pour explorer',html:`<p>Trouve un passage facile qui exige la technique. Observe un replay récent dans le même jeu et le même mode, puis essaie le mouvement depuis un point fixe. Change une seule entrée ou un seul timing par série.</p><p>Ce chapitre est une carte des sujets, pas une validation de toutes leurs variantes. Les guides de base du site expliquent des gestes reproductibles ; les détails de ces techniques doivent être confirmés sur le serveur concerné.</p>`},
 {title:'Le bon moment pour approfondir',html:`<p>Si tu n’arrives pas encore à viser une grande réception ou à relier deux bhops, continue ces exercices. Si tu contrôles déjà ces gestes, choisis une seule technique avancée correspondant à ta map du moment.</p><p>Un bind ou une macro ne remplace pas l’observation. Cherche d’abord une exécution manuelle que tu peux expliquer, puis reproduire.</p>`}
 ],exercise:{title:'Un problème concret',text:'Choisis un passage où tu sais nommer ce qui manque : hauteur, distance, vitesse conservée ou direction. Cherche une démonstration du même mode. Travaille ce seul problème pendant une courte séance.'}}
];
const GLOSSARY = [
 ['KZ','Kreedz : parcourir des cartes d’obstacles en maîtrisant le mouvement.'],['LJ','Longjump : course, saut, réception.'],['LAJ','Ladderjump : départ depuis une échelle sans appui au sol.'],['LAH','Ladderhop : contact échelle + sol avant le saut.'],['BH / MBH','Bunnyhop / multibhop : saut enchaîné à une réception / chaîne de sauts.'],['WJ','Weirdjump : chute depuis un rebord suivie d’un rebond.'],['JB','Jumpbug : technique de transition crouch / saut près du sol.'],['Pre','Vitesse au début du saut.'],['CP / TP','Checkpoint / téléportation : mémoriser une position / y revenir.'],['VNL','Vanilla : mode qui vise le mouvement natif du jeu concerné. CS:GO VNL et CS2 VNL restent distincts.'],['SKZ / KZT','SimpleKZ / KZTimer : deux modes de mouvement modifiés de GOKZ.'],['CKZ','Classic : mode modifié de CS2KZ.'],['Unités · u','Mesure de distance du moteur. u/s désigne la vitesse.'],['Tier','Niveau de difficulté d’une carte, ou palier de jumpstats selon le contexte.'],['PB','Personal best : ton meilleur résultat personnel, dans un contexte donné.'],['Offset','Différence de hauteur entre l’arrivée et le départ.'],['Block','Écart entre les blocs mesuré selon les règles du plugin ; distinct de la distance de saut.'],['Edge','Distance au bord au départ, avec une définition particulière pour les ladders dans GOKZ.'],['Sync','Indicateur de coordination du mouvement. La définition exacte dépend du plugin.'],['DA / OL','Dead air / overlap : aucune touche latérale / les deux à la fois, selon la mesure du plugin.']

const LESSONS_EN = [
 {id:'start',title:'Your first blocks',short:'Getting started',group:'THE FOUNDATIONS',number:'01',level:'Beginner',minutes:5,desc:'Choose your environment, understand CP / TP and finish your first map.',
 intro:'KZ means crossing a map through movement. Before chasing a time, learn to read the blocks and repeat a jump.',
 sources:['gokz','browser','installgo','lan'],
 sections:[
  {title:'Choose the right environment',html:`<p>Join a KZ server that identifies its plugin and mode. To get started, look for an easy map: tier 1 or 2. A flat longjump area is useful, but finishing a short map also teaches you to aim for landings.</p><p>On CS2, the <a href="https://cs2kz.org/" target="_blank" rel="noopener noreferrer">CS2KZ portal</a> is a starting point for finding a server. On CS:GO, check that your server uses GOKZ before copying commands from this guide.</p><div class="callout"><div class="callout-label">YOUR FIRST GOAL</div><p>Finish an easy map using as many teleports as you need. Your TP count is a learning tool, not a judgement of your skill.</p></div>`},
  {title:'Checkpoint, attempt, return',html:`[[diagram:route]]<div class="steps"><div class="step"><div><h3>Look at the landing</h3><p>Find a wide, stable surface, then choose your starting point.</p></div></div><div class="step"><div><h3>Set a checkpoint</h3><p>A CP saves a position allowed by the server. It lets you practise the same section.</p></div></div><div class="step"><div><h3>Change just one thing</h3><p>Try a new direction, a slightly later takeoff or a smoother mouse movement. Return to your CP after the attempt.</p></div></div></div>`},
  {title:'Prepare your controls',html:`<p>Enable the developer console in the game settings and assign it an accessible key. In the <a href="#binds">bind generator</a>, choose your game and the server’s plugin. Keep jump and crouch on separate inputs to learn their timing.</p><p>To run a game server on your PC, you need to install the KZ components: opening a Workshop map alone does not reproduce a server’s physics. The CS2KZ LAN guide cited here is for Windows; this documentation website also runs on Linux.</p>`}
 ],exercise:{title:'A first map, without pressure',text:'Choose three easy sections. Set a CP before each and complete each one three times. Then link them together. Simply note which section made you lose control.'}},
 {id:'modes',title:'Same game. Different physics.',short:'Understanding modes',group:'THE FOUNDATIONS',number:'02',level:'Essential',minutes:5,desc:'VNL, SKZ, KZT, CKZ: compare like with like.',
 intro:'The game’s name is not enough. The plugin, mode and settings determine which jumps you can make.',
 sources:['modesgo','modescs2','vnlcs2','ckzcs2'],
 sections:[
 {title:'A map of the modes',html:`<div class="table-wrap"><table><thead><tr><th>Game / plugin</th><th>Mode</th><th>What to remember</th></tr></thead><tbody><tr><td>CS:GO / GOKZ</td><td>Vanilla · VNL</td><td>Movement close to native CS:GO; no added prestrafe bonus.</td></tr><tr><td>CS:GO / GOKZ</td><td>SimpleKZ · SKZ</td><td>Modified prestrafe and movement; higher air acceleration.</td></tr><tr><td>CS:GO / GOKZ</td><td>KZTimer · KZT</td><td>Another modified mode; bhop behaviour differs from SKZ.</td></tr><tr><td>CS2 / CS2KZ</td><td>Vanilla · VNL</td><td>Aims to preserve native CS2 physics.</td></tr><tr><td>CS2 / CS2KZ</td><td>Classic · CKZ</td><td>A spiritual successor to SKZ, with its own mechanics.</td></tr></tbody></table></div><div class="callout amber"><div class="callout-label">WATCH THE NAME</div><p>GOKZ’s KZT mode and the standalone KZTimer plugin are not exactly the same environment. This manual’s commands target GOKZ and CS2KZ.</p></div>`},
 {title:'Why your distances change',html:`<p>In GOKZ, airacceleration is 12 in VNL, compared with 100 in SKZ and KZT. A turn that works in one mode may therefore behave differently in another. In CS2KZ, VNL and Classic also use different jump systems.</p><p>Choose one environment for your session and stick with it. To compare two attempts, also keep the jump type, landing height and server version the same.</p>`},
 {title:'Which mode should you choose?',html:`<p>Start with the one used by the community you want to play with. VNL is relevant for practising movement close to the base game; modified modes offer another way to run maps. Neither is a required step before the other.</p><p>Always write down the context of your record: “CS:GO · GOKZ · VNL · LJ”, for example. A bare “250” is not enough to understand the performance.</p>`}
 ],exercise:{title:'Name your environment',text:'Before your next attempt, identify the game, plugin and mode in the server’s menu. Write all three in your journal. Do not chase a distance threshold yet.'}},
 {id:'prestrafe',title:'It all starts on the ground.',short:'Prestrafe & takeoff',group:'THE FOUNDATIONS',number:'03',level:'Fundamental',minutes:6,desc:'Prepare your speed and leave the block in the right place.',
 intro:'A good jump cannot always rescue a poor start. Separate your starting speed, exit direction and distance from the edge.',
 sources:['modesgo','skz','strafing'],
 sections:[
 {title:'Build a consistent start',html:`<p>Practise on a wide block with a fixed visual reference. Start from the same place and repeat the same approach. Watch your takeoff speed rather than the highest speed reached during the run-up.</p>[[diagram:prestrafe]]<p>For a conventional forward jump, finish your run-up on a path aimed at the landing. Release forward at takeoff, then begin your first air strafe. Techniques that keep W held do exist, but they are beyond this first exercise.</p>`},
 {title:'VNL and modified prestrafe',html:`<p>In GOKZ VNL, do not try to obtain the prestrafe bonus used in modified modes. In SKZ, the system rewards running while turning; the documented maximum is about 276.54 u/s. Reversing the turn resets this bonus.</p><p>Turning faster does not always produce a larger bonus. This SKZ value is neither a VNL target nor a promise for CS2 Classic.</p><div class="callout"><div class="callout-label">A USEFUL REFERENCE</div><p>A repeatable start is worth more than an exceptional start you cannot reproduce. You can then experiment with taking off closer to the edge.</p></div>`},
 {title:'Correct your takeoff',html:`<div class="table-wrap"><table><thead><tr><th>What you see</th><th>Next attempt</th></tr></thead><tbody><tr><td>Starting speed varies widely</td><td>Use a longer preparation area and keep the same starting reference.</td></tr><tr><td>You fall without jumping</td><td>Trigger the jump a little earlier, then gradually move closer to the edge.</td></tr><tr><td>Your first strafe heads off course</td><td>Reduce the final turn on the ground and aim for a wider landing.</td></tr></tbody></table></div>`}
 ],exercise:{title:'10 starts, one variable',text:'On the same server and block, make ten starts. Record your pre and whether the jump triggered properly. Adjust only the takeoff point during the set; keep everything else the same.'}},
 {id:'strafe',title:'Guide your speed.',short:'Air strafing',group:'THE MOVEMENT',number:'04',level:'Fundamental',minutes:7,desc:'Pair a keyboard direction with a mouse turn.',
 intro:'Strafing is not a fast sweep of the mouse. It is coordination that steers your path through the air.',
 sources:['strafing','modesgo','modescs2'],
 sections:[
 {title:'Understand the movement',html:`<p>For a conventional forward strafe: hold left and gently turn your view left; hold right and gently turn right. When switching sides, change the key and the turning direction together. Release forward during this exercise.</p>[[diagram:strafe]]<p>The right angle depends on speed and mode. A sudden or overly wide sweep can hurt your movement. Start with one clean turn, then add the return.</p>`},
 {title:'Learn without tensing up',html:`<div class="steps"><div class="step"><div><h3>One arc to the left</h3><p>Jump towards a very wide surface. Release forward, hold left and make a small mouse movement to the left.</p></div></div><div class="step"><div><h3>One arc to the right</h3><p>Repeat the exercise on the other side. Focus on controlling your landing, not maximum distance.</p></div></div><div class="step"><div><h3>Two arcs in the same jump</h3><p>About halfway through, release one side and press the other as you reverse the turn. This is a teaching reference, not a required optimal timing.</p></div></div></div>`},
 {title:'Common pitfalls',html:`<p>Adding more changes does not automatically improve your jump. If your last strafes look like tiny jerks, slow the exercise down. Above all, check whether you land where you intended.</p><p>Do not change sensitivity, DPI and movement range at the same time. Keep comfortable settings; measure the effect of one change over several attempts. No sensitivity value is a universal solution.</p>`}
 ],exercise:{title:'Two arcs, one target',text:'Set a CP in front of a wide platform. Make five jumps with one arc, then five with two arcs. Compare landing accuracy before comparing distance.'}},
 {id:'longjump',title:'The longjump, broken down.',short:'Longjump',group:'THE MOVEMENT',number:'05',level:'Fundamental → advanced',minutes:8,desc:'Combine the approach, takeoff, strafes and landing.',
 intro:'A clean LJ is one continuous sequence: prepare the start, leave the edge, guide the flight and reach the landing.',
 sources:['strafing','stats','tiers','modescs2'],
 sections:[
 {title:'See the sequence',html:`<p>This demonstration shows a conventional forward jump. Keys are shown in QWERTY: on AZERTY, left is usually Q and forward is Z.</p>[[sequence:longjump]]<div class="callout"><div class="callout-label">DIAGRAM, NOT SIMULATOR</div><p>The positions, durations and keys in the drawing explain the order of the actions. They do not calculate distance or reproduce the game engine.</p></div>`},
 {title:'Aim for the block',html:`<p>Choose a landing easier than your maximum. Use the same reference for your approach, jump near the edge and focus on two or three controlled strafes. This number is an exercise, not a performance rule.</p><p>Jumpstat distance and the width of the gap do not measure the same thing. Starting far from the edge or crossing diagonally can make you miss a block even if the reported distance seems sufficient.</p><p>Practise crouching separately. For a landing at the same height, crouching late in the flight may help you clear the edge; crouching from the run-up changes your start. Repeat the same procedure before comparing attempts.</p>`},
 {title:'Read the tiers correctly',html:`<p>Here are some default thresholds from the GOKZ configuration, for longjumps only. The server can change them.</p><div class="table-wrap"><table><thead><tr><th>GOKZ tier</th><th>VNL</th><th>SKZ / KZT</th></tr></thead><tbody><tr><td>Impressive</td><td>235</td><td>265</td></tr><tr><td>Perfect</td><td>240</td><td>270</td></tr><tr><td>Godlike</td><td>245</td><td>275</td></tr><tr><td>Ownage</td><td>248</td><td>280</td></tr><tr><td>Wrecker</td><td>250</td><td>282</td></tr></tbody></table></div><p>Distances are in game units. This table describes neither CS2KZ nor every standalone KZTimer server. Use your own history to set your next goal.</p>`},
 {title:'When your distance stalls',html:`<p>Keep three successful attempts and three failed ones. Compare the start and the direction of the landing first, then the strafe changes. A good-looking sync percentage does not necessarily make up for a poor path.</p><p>If you succeed once in ten attempts, lower the difficulty slightly. Aim for a repeatable set, then return to the harder block.</p>`}
 ],exercise:{title:'Two comparable sets',text:'Do two sets of ten LJs in the same mode. Set A: your usual approach. Set B: change only the takeoff point. Compare median distances and the number of successful jumps, not just the record.'}},
 {id:'ladder',title:'Leave the ladder. Keep control.',short:'Ladderjump',group:'THE MOVEMENT',number:'06',level:'Intermediate',minutes:8,desc:'Distinguish a ladderjump, a ladderhop and a controlled exit.',
 intro:'A ladder is not a vertical block. Practise the phase where you leave it separately from the strafe that follows.',
 sources:['stats','modesgo','modescs2'],
 sections:[
 {title:'Two different jumps',html:`[[diagram:ladder]]<p>A ladderjump leaves the ladder without touching the ground. A ladderhop involves ladder + ground contact before the jump. In GOKZ, a valid LAJ requires, among other conditions, the top of the ladder and the target block to be at the same height.</p><p>Do not confuse successfully exiting a ladder on a map with producing a valid LAJ jumpstat. The measurement criteria are more specific.</p>`},
 {title:'Build a simple exit',html:`<div class="steps"><div class="step"><div><h3>Choose an easy ladder</h3><p>Pick an isolated ladder with a large landing nearby. Set an allowed CP before the approach.</p></div></div><div class="step"><div><h3>Make the climb consistent</h3><p>Watch how your view angle and keys change the climb. Establish a repeatable approach before chasing distance.</p></div></div><div class="step"><div><h3>Practise detaching</h3><p>For a conventional exit at the top, keep moving until you leave the ladder’s volume without landing on a ledge. Do not automatically add a jump press: it can push you away from the ladder.</p></div></div><div class="step"><div><h3>Add just one strafe</h3><p>Once clear, guide yourself towards the platform with a smooth movement. Increase the gap only when your exit is consistent.</p></div></div></div>`},
 {title:'Diagnose a poor exit',html:`<div class="table-wrap"><table><thead><tr><th>Symptom</th><th>What to check</th></tr></thead><tbody><tr><td>You stay stuck to the ladder</td><td>Is your movement taking you back into its volume? Simplify your exit angle.</td></tr><tr><td>You are pushed away before the top</td><td>Check whether a jump press detached you too early.</td></tr><tr><td>A different jumpstat appears</td><td>Check ground contacts, block height and the plugin’s rules.</td></tr><tr><td>You exit but miss to the side</td><td>Keep the climb identical and change only the first strafe.</td></tr></tbody></table></div><p>Ladder angles, ledges and mode physics vary. One fixed camera angle or one key sequence cannot suit every situation.</p>`}
 ],exercise:{title:'Exit first, distance later',text:'Make five successful exits to the same nearby platform. Then add a strafe without changing your approach. Watch the historical tutorial in the resources to see the movement; check the result on your own server.'}},
 {id:'bhop',title:'Find the rhythm.',short:'Bunnyhop',group:'THE MOVEMENT',number:'07',level:'Intermediate',minutes:6,desc:'Link landings without confusing scrolling with automation.',
 intro:'Bunnyhopping connects one landing to the next jump. You practise timing, landing direction and preparation for the next block.',
 sources:['modesgo','skz','modescs2','valvejump'],
 sections:[
 {title:'A landing that prepares the next jump',html:`[[diagram:bhop]]<p>Start on a wide, flat surface. Bind manual scrolling to jump and try to jump again close to ground contact. The exact timing and retained speed depend on the mode.</p><p>Aim for a landing that leaves room for the next jump. Landing on a block’s corner can look impressive but be very difficult to link into another jump.</p>`},
 {title:'CS:GO and CS2 are not identical',html:`<p>In GOKZ, VNL keeps the constraints of native CS:GO movement; SKZ and KZT change the bhop rules. Classic in CS2 also has its own speed-retention logic.</p><div class="callout amber"><div class="callout-label">CS2 · 2026 UPDATE</div><p>Valve changed native jumping in January 2026: subtick landing, a bhop window and a spam penalty. Jumping and landing no longer affect native stamina as before. “Scroll as much as possible” is therefore not reliable advice.</p></div><p>An old CS:GO video can illustrate the movement without giving you the exact timing to use in CS2 VNL. Practise the rhythm in your current mode.</p>`},
 {title:'Improve with short chains',html:`<p>Start with two jumps. Once they become consistent, move to three, then a short set of blocks. If the second jump often fails, repeat just the first landing.</p><p>This site provides a simple <code>+jump</code> bind. Do not automatically multiply scroll-wheel inputs: it does not teach timing and may break the server’s rules.</p>`}
 ],exercise:{title:'Two, then three',text:'Complete five chains of two jumps on a wide surface. Then try three jumps. Note the landing point where the chain breaks, and place your next checkpoint just before it.'}},
 {id:'crouch',title:'Make room.',short:'Crouch & landings',group:'THE MOVEMENT',number:'08',level:'Fundamental',minutes:5,desc:'Use crouching to clear obstacles without disrupting your approach.',
 intro:'Crouching changes the player’s collision volume. Its usefulness depends on the obstacle and when you use it.',
 sources:['strafing','stats','valvebind'],
 sections:[
 {title:'Separate three situations',html:`[[diagram:crouch]]<div class="table-wrap"><table><thead><tr><th>Situation</th><th>What you practise</th></tr></thead><tbody><tr><td>Getting onto an obstacle</td><td>Jumping, then crouching to let the player’s volume clear it.</td></tr><tr><td>Reaching a distant edge</td><td>The end of your path and the timing of your crouch.</td></tr><tr><td>Passing under a ceiling</td><td>Reduced available height; the passage requires the action.</td></tr></tbody></table></div><p>These are different situations. Crouch with a specific purpose rather than holding the key throughout every jump.</p>`},
 {title:'Keep the actions separate',html:`<p>Learn with two separate commands: jump and crouch. The generator initially selects C for crouch, with Ctrl as an alternative. Hold the key for as long as needed, then release it.</p><p>A bind combining jump and crouch behaves differently depending on the game or plugin. CS2 restricts binds that combine multiple movement actions; this site provides simple commands.</p>`},
 {title:'Read the collision',html:`<p>If you hit the front of a block, watch where your feet are at the moment of contact. If you hit a ceiling, check the space above your path. Sound and a spectator view can help you tell these two cases apart.</p><p>On a given obstacle, compare three timings: early in the flight, halfway through and near the landing. Only compare attempts with similar approaches. There is no universal millisecond value for crouching.</p>`}
 ],exercise:{title:'One obstacle, three timings',text:'On an easy step, make three attempts for each crouch timing. Note which one works most consistently. Then return to a flat landing to separate clearing a vertical obstacle from longjumping.'}},
 {id:'routes',title:'Link the movements.',short:'Read maps & routes',group:'MAKE PROGRESS',number:'09',level:'Intermediate',minutes:5,desc:'Turn one successful section into a repeatable route.',
 intro:'Playing a map means thinking several movements ahead. The best landing already prepares the next takeoff.',
 sources:['gokz','commands','browser'],
 sections:[
 {title:'Break down a section',html:`[[diagram:route]]<p>Identify a safe area, a difficult passage and the exit from the section. Set a CP before the difficulty. After succeeding several times, move your CP back to practise the full approach.</p><p>Compare two routes over short sets of attempts. A shortcut that is faster on one attempt may cost you more time overall if you miss it often.</p>`},
 {title:'Use a replay',html:`<p>GOKZ replays let you study routes. Look at where the player takes off, where they land and what they prepare next. Start with an accessible section instead of trying to copy an entire record run.</p><p>The GOKZ documentation lists <code>!replay</code>. On another plugin, use the server’s menu or help. Replay features and key displays vary.</p>`},
 {title:'Make a route reliable',html:`<div class="steps"><div class="step"><div><h3>Complete the movement in isolation</h3><p>Practise it from a nearby checkpoint with a simple landing.</p></div></div><div class="step"><div><h3>Add the approach</h3><p>Move your starting point back. The movement must work after the preceding one.</p></div></div><div class="step"><div><h3>Add the exit</h3><p>Continue to the next stable block. A landing is only useful if you can move on from it.</p></div></div></div>`}
 ],exercise:{title:'A three-block section',text:'Choose a short section. Complete block 2 in isolation, then blocks 1 → 2, then 1 → 2 → 3. Keep the most consistent route before chasing a time.'}},
 {id:'stats',title:'Read the jump, not just the number.',short:'Understanding jumpstats',group:'MAKE PROGRESS',number:'10',level:'Intermediate',minutes:7,desc:'Pre, sync, DA, overlap and distance: use each measurement well.',
 intro:'A jumpstat describes one attempt. To find a cause, compare several jumps made in the same environment.',
 sources:['stats','changes','tiers'],
 sections:[
 {title:'Useful fields',html:`<div class="table-wrap"><table><thead><tr><th>GOKZ field</th><th>Meaning</th></tr></thead><tbody><tr><td>Pre / Max</td><td>Speed at takeoff / maximum speed in the air.</td></tr><tr><td>Strafes</td><td>Counted from changes in mouse direction.</td></tr><tr><td>Sync</td><td>Proportion of ticks that gain speed with coordinated inputs.</td></tr><tr><td>DA / OL</td><td>Ticks without left/right / ticks with both sides held.</td></tr><tr><td>W</td><td>Release of forward relative to takeoff; positive = late.</td></tr><tr><td>Width</td><td>Average angle turned per strafe.</td></tr><tr><td>Offset</td><td>Height difference: landing − takeoff.</td></tr><tr><td>Crouched</td><td>Ticks spent crouched.</td></tr></tbody></table></div><div class="callout"><div class="callout-label">AIRTIME: CHECK THE UNIT</div><p>Modern GOKZ has displayed overall airtime in ticks since version 3.0.0. At 128 ticks/s, 100 ticks is about 0.781 s. The old wiki page still says seconds. Do not assume this unit applies to every CS2 plugin.</p></div>`},
 {title:'An example to interpret',html:`<div class="metric-example"><div><span>DISTANCE</span><b>240.0</b></div><div><span>PRE</span><b>249.9</b></div><div><span>SYNC</span><b>78%</b></div><div><span>DA</span><b>12</b></div></div><p>A fictional CS:GO / GOKZ / VNL example, used to read the fields. This table alone is not enough to diagnose the jump.</p><p>If your next attempts keep a similar pre but become more consistent after you simplify the strafe changes, that simplification is worth keeping. Check it over another set before drawing a conclusion.</p>`},
 {title:'Avoid false diagnoses',html:`<p>A higher sync percentage does not automatically mean more distance. Neither does a higher strafe count. Also check the landing direction, edge, jump type and offset.</p><p>Do not compare a drop with a same-height LJ. Do not mix statistics from GOKZ, standalone KZTimer and CS2KZ. For a specific attempt, check the definitions of the plugin you are using.</p>`}
 ],exercise:{title:'Compare sets, not records',text:'Keep ten attempts at the same jump. Record median distance and the number of successful attempts. Choose one point to work on for the next ten. A repeatable improvement tells you more than one isolated number.'}},
 {id:'advanced',title:'The next part of the route.',short:'Advanced techniques',group:'MAKE PROGRESS',number:'11',level:'Advanced',minutes:5,desc:'WJ, pre-keep, jumpbug, slides: know what to explore next.',
 intro:'Advanced techniques solve specific situations. First learn to recognise the problem, then look for the movement.',
 sources:['stats','modescs2','skz'],
 sections:[
 {title:'Recognise the families',html:`<div class="table-wrap"><table><thead><tr><th>Term</th><th>Idea</th><th>Prerequisites</th></tr></thead><tbody><tr><td>Weirdjump · WJ</td><td>Leave a ledge without jumping, then bounce on landing.</td><td>A controlled drop and bhop. Measurement criteria depend on the plugin.</td></tr><tr><td>Pre-keep</td><td>Preserve useful speed from one movement to the next.</td><td>Understand the mode and block rules.</td></tr><tr><td>Jumpbug · JB</td><td>A transition between crouching and jumping close to ground contact.</td><td>Advanced timing; no single recipe works across all games.</td></tr><tr><td>Slide / surf</td><td>Use a slope’s geometry to guide movement.</td><td>Reading slopes, controlled entry and exit.</td></tr><tr><td>Half-sideways · HSW</td><td>A view orientation and input style different from conventional forward strafing.</td><td>Understand the movement before pursuing the style.</td></tr></tbody></table></div>`},
 {title:'A method for exploring',html:`<p>Find an easy passage that requires the technique. Watch a recent replay in the same game and mode, then try the movement from a fixed point. Change only one input or one timing per set.</p><p>This chapter maps the topics; it does not validate every variation. The site’s basic guides explain repeatable movements; the details of these techniques need to be confirmed on the relevant server.</p>`},
 {title:'When to go deeper',html:`<p>If you cannot yet aim for a large landing or link two bhops, keep working on those exercises. If you already control those movements, choose one advanced technique that suits the map you are playing.</p><p>A bind or macro does not replace observation. First find a manual execution you can explain, then repeat.</p>`}
 ],exercise:{title:'A specific problem',text:'Choose a passage where you can name what is missing: height, distance, retained speed or direction. Find a demonstration in the same mode. Work on that one problem during a short session.'}}
];
const GLOSSARY_EN = [
 ['KZ','Kreedz: crossing obstacle maps by mastering movement.'],['LJ','Longjump: run-up, jump, landing.'],['LAJ','Ladderjump: takeoff from a ladder without ground contact.'],['LAH','Ladderhop: ladder + ground contact before the jump.'],['BH / MBH','Bunnyhop / multibhop: a jump linked to a landing / a chain of jumps.'],['WJ','Weirdjump: a drop from a ledge followed by a bounce.'],['JB','Jumpbug: a crouch / jump transition technique near the ground.'],['Pre','Speed at the start of a jump.'],['CP / TP','Checkpoint / teleport: save a position / return to it.'],['VNL','Vanilla: a mode aiming for the native movement of its game. CS:GO VNL and CS2 VNL remain distinct.'],['SKZ / KZT','SimpleKZ / KZTimer: two modified GOKZ movement modes.'],['CKZ','Classic: CS2KZ’s modified mode.'],['Units · u','The engine’s distance measurement. u/s denotes speed.'],['Tier','A map’s difficulty level, or a jumpstats threshold depending on context.'],['PB','Personal best: your best personal result in a given context.'],['Offset','Height difference between landing and takeoff.'],['Block','The gap between blocks measured under the plugin’s rules; distinct from jump distance.'],['Edge','Distance from the edge at takeoff, with a specific definition for ladders in GOKZ.'],['Sync','A movement-coordination indicator. Its exact definition depends on the plugin.'],['DA / OL','Dead air / overlap: no lateral key / both at once, as measured by the plugin.']
];
</script><script>function svgWrap(body,label,view='0 0 600 280'){body=figureText(body);label=figureText(label);const id='grid'+(++svgId);return `<svg viewBox="${view}" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="${escapeHTML(label)}"><defs><pattern id="${id}" width="25" height="25" patternUnits="userSpaceOnUse"><path d="M25 0H0V25" fill="none" stroke="#88a36c" stroke-opacity=".09" stroke-width="1"/></pattern></defs><rect width="100%" height="100%" fill="url(#${id})"/><g font-family="Consolas,monospace" font-size="11" fill="#a4b694">${body}</g></svg>`;}
function block(x,y,w,h){return `<path d="M${x} ${y}h${w}v${h}h-${w}z" fill="#26331f" stroke="#536946"/><path d="M${x} ${y}h${w}" stroke="#accb8e" stroke-width="2"/><path d="M${x+9} ${y+13}h${w-18}" stroke="#34442a"/>`;}
function player(x,y,crouched=false,opacity=1){return `<g transform="translate(${x} ${y})" opacity="${opacity}"><rect x="-7" y="${crouched?-24:-45}" width="14" height="${crouched?24:45}" rx="2" fill="#c6f779" fill-opacity=".12" stroke="#c6f779"/><circle cy="${crouched?-18:-36}" r="3.5" fill="#c6f779"/><path d="M0 ${crouched?-13:-30}V-9M-5 0L0-9L5 0M-6 ${crouched?-8:-20}L0 ${crouched?-13:-26}L6 ${crouched?-8:-20}" fill="none" stroke="#c6f779" stroke-width="1.6"/></g>`;}
function isoHero(){return svgWrap(`<g stroke="#506440" stroke-width="1"><path d="M-15 290L225 160L555 337M20 315L260 185M75 345L315 215M132 377L373 245" fill="none" opacity=".3"/><path d="M45 220L180 147L298 211L163 286Z" fill="#2e3a25"/><path d="M45 220V301L163 367V286Z" fill="#1d2619"/><path d="M163 286V367L298 292V211Z" fill="#232e1d"/><path d="M316 157L422 100L536 161L429 220Z" fill="#34442a"/><path d="M316 157V246L429 309V220Z" fill="#232f1c"/><path d="M429 220V309L536 250V161Z" fill="#1b2416"/><path d="M143 251L259 187M156 259L274 194" fill="none" stroke="#7b975e"/><path d="M343 173L447 118M357 181L462 126" fill="none" stroke="#79995e"/><path d="M228 213C279 30 363 13 401 171" stroke="#c6f779" stroke-width="2.5" fill="none"/><path d="M228 213L401 171" stroke="#8aaa68" stroke-dasharray="4 6" fill="none"/><ellipse cx="228" cy="213" rx="15" ry="8" fill="#c6f779" fill-opacity=".13" stroke="#c6f779"/><ellipse cx="401" cy="171" rx="15" ry="8" fill="#c6f779" fill-opacity=".13" stroke="#c6f779"/><circle cx="307" cy="78" r="5" fill="#c6f779"/><path d="M307 78V203" stroke="#7d9b61" stroke-dasharray="2 5"/><path d="M155 104H222L228 192M420 72H460L453 116" fill="none" stroke="#688053"/></g><text x="108" y="97" font-size="10" fill="#c6f779">01 / DÉPART</text><text x="423" y="61" font-size="10" fill="#c6f779">02 / ARRIVÉE</text><text x="266" y="263" font-size="9" transform="rotate(-14 266 263)">TRAJECTOIRE</text><text x="88" y="276" font-size="30" opacity=".35" transform="skewY(28)">KZ</text>`,`Blocs KZ en perspective et trajectoire schématique entre deux plateformes`,'0 0 580 420');}
function diagram(kind,compact=false){let body='',label='',caption='Schéma pédagogique original · non à l’échelle · aucun calcul physique.';

older')}</h3><p>${t('Steam → propriétés du jeu → fichiers installés → parcourir. Cette méthode fonctionne sous Windows comme sous Linux.','Steam → game properties → installed files → browse. This works on Windows and Linux.')}</p></div></div><div class="step"><div><h3>${t('Placer le fichier .cfg','Place the .cfg file')}</h3><p id="cfg-path"></p></div></div><div class="step"><div><h3>${t('Exécuter dans la console','Run it in the console')}</h3><p id="cfg-exec"></p></div></div></div></section><section class="article-section"><h2>${t('Commandes & compatibilité','Commands & compatibility')}</h2><div class="table-wrap"><table><thead><tr><th>${t('Commande','Command')}</th><th>CS:GO / GOKZ</th><th>CS2 / CS2KZ</th></tr></thead><tbody>${[[t('Saut / crouch','Jump / crouch'),'+jump / +duck','+jump / +duck'],[t('Déplacement latéral','Sideways movement'),'+moveleft / +moveright','+left / +right'],['Checkpoint','sm_checkpoint','kz_cp'],[t('Téléportation','Teleport'),'sm_gocheck','kz_tp'],[t('Annuler le dernier TP','Undo last TP'),'sm_undo','kz_undo']].map(row=>`<tr>${row.map(x=>`<td>${x}</td>`).join('')}</tr>`).join('')}</tbody></table></div><p>${t('CP et TP sont des commandes de plugins. Elles ne fonctionnent pas dans une partie normale sans ce plugin. Les autres communautés peuvent employer d’autres commandes.','CP and TP are plugin commands. They do not work in a normal game without that plugin. Other communities may use different commands.')}</p><p>${t('Sur CS2, les binds combinant plusieurs actions de mouvement ou de tir sont ignorés par défaut. Certaines automatisations peuvent provoquer une exclusion des serveurs Valve. Ce preset contient seulement des commandes simples, sans null bind ni script de longjump.','In CS2, binds combining multiple movement or attack actions are ignored by default. Certain movement automation can lead to a kick from Valve servers. This preset contains only simple commands, with no null binds or longjump scripts.')}</p><p>${t('Commandes vérifiées function cfg(){const cs2=state.game==='cs2',p=bindPrefs;const lines=[`// KZ ATLAS - ${cs2?'CS2 / CS2KZ':'CSGO / GOKZ'}`,t('// Commandes manuelles. Ne remplace pas votre autoexec.','// Manual commands. Does not replace your autoexec.'),t('// Sauvegardez vos binds actuels avant execution.','// Back up existing binds before running.'),'','bind "SPACE" "+jump"'];const affected=[t('Espace','Space')];if(p.wheel!=='none'){lines.push(`bind "${p.wheel.toUpperCase()}" "+jump"`);affected.push(p.wheel==='mwheeldown'?t('molette bas','scroll down'):t('molette haut','scroll up'));}lines.push(`bind "${p.crouch.toUpperCase()}" "+duck"`);affected.push(p.crouch.toUpperCase());if(p.extra==='mouse4'){lines.push('bind "MOUSE4" "+jump"');affected.push('Mouse4');}if(p.move){lines.push('',t('// Deplacement','// Movement'));const forward=p.layout==='azerty'?'Z':'W',left=p.layout==='azerty'?'Q':'A';lines.push(`bind "${forward}" "+forward"`,'bind "S" "+back"',`bind "${left}" "${cs2?'+left':'+moveleft'}"`,`bind "D" "${cs2?'+right':'+moveright'}"`);affected.push(`${forward} / ${left} / S / D`);}if(p.plugin){lines.push('',t('// Uniquement sur un serveur equipe du plugin','// Only on a server with the matching plugin'),`bind "ALT" "${cs2?'kz_cp':'sm_checkpoint'}"`,`bind "MOUSE5" "${cs2?'kz_tp':'sm_gocheck'}"`);affected.push('Alt','Mouse5');}return {text:lines.join('\n')+'\n',name:`kz_atlas_${state.game}.cfg`,affected};}
